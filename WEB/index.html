<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Menú Principal</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(3rem, 10vw, 6rem);
    color: #d4af37;
    text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    margin-bottom: 10px;
  }

  h2 {
    font-family: 'Dancing Script', cursive;
    font-weight: 600;
    font-size: clamp(1.3rem, 4vw, 2rem);
    color: #000;
    background: #fff;
    display: inline-block;
    padding: 4px 20px;
    border-radius: 10px;
    margin-bottom: 50px;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 25px;
    justify-content: center;
  }

  nav a {
    text-decoration: none;
    color: #d4af37;
    border: 2px solid #d4af37;
    padding: 18px 40px;
    border-radius: 12px;
    font-family: 'Dancing Script', cursive;
    font-weight: 600;
    font-size: 1.5rem;
    transition: all 0.3s ease;
  }

  nav a:hover {
    background: #d4af37;
    color: #0d0d0d;
    transform: translateY(-4px);
  }
</style>
</head>
<body>

  <h1>Menú Principal</h1>
  <h2>Bryan Martínez Méndez</h2>

  <nav>
    <a href="exercises/exercises/">Exercises</a>
    <a href="WEBMIA/index.html">WEBMIA</a>
    <a href="WEBMIA2/index.html">WEBMIA2</a>
  </nav>

</body>
</html>
